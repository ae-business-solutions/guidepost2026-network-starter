# A two-switch lab to practice steps 3-5 on.
#   sudo containerlab deploy -t lab/starter.clab.yml
#   sudo containerlab destroy -t lab/starter.clab.yml --cleanup
# Needs the Arista cEOS image (free Arista account): docker import cEOS64-lab-4.34.2F.tar.xz ceos:4.34.2F
#
#   sw1 Ethernet1 ---- Ethernet1 sw2      eBGP over two /31 links
#   sw1 Ethernet2 ---- Ethernet2 sw2
#   sw1 Ethernet3 ---- eth1 host1         access port, VLAN 10
name: starter

mgmt:
  network: starter-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.34.2F
  nodes:
    sw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11
      startup-config: sw1.cfg
    sw2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12
      startup-config: sw2.cfg
    host1:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 172.20.20.21
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
  links:
    - endpoints: ["sw1:eth1", "sw2:eth1"]
    - endpoints: ["sw1:eth2", "sw2:eth2"]
    - endpoints: ["sw1:eth3", "host1:eth1"]
