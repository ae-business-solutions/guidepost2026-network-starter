! Lab only. Users: admin/admin (read-write), collector/collector (read-only).
hostname sw2
!
username admin privilege 15 role network-admin secret <removed>
username collector privilege 15 role network-operator secret <removed>
aaa authorization exec default local
!
management api http-commands
   no shutdown
!
ntp server 192.0.2.123
ntp server 192.0.2.124
!
spanning-tree mode mstp
!
interface Ethernet1
   description sw1 Ethernet1
   no switchport
   ip address 10.0.0.1/31
!
interface Ethernet2
   description sw1 Ethernet2
   no switchport
   ip address 10.0.0.3/31
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Management0
   ip address 172.20.20.12/24
!
ip routing
!
ip route 0.0.0.0/0 172.20.20.1
!
router bgp 65002
   router-id 10.255.0.2
   timers bgp 3 9
   maximum-paths 2
   neighbor 10.0.0.0 remote-as 65001
   neighbor 10.0.0.2 remote-as 65001
   network 10.255.0.2/32
!
end
