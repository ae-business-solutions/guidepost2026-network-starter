! Lab only. Users: admin/admin (read-write), collector/collector (read-only).
hostname sw1
!
username admin privilege 15 role network-admin secret <removed>
username collector privilege 15 role network-operator secret <removed>
aaa authorization exec default local
!
management api http-commands
   no shutdown
!
ntp server 192.0.2.123
ntp server 192.0.2.124
!
spanning-tree mode mstp
!
vlan 10
   name USERS
!
interface Ethernet1
   description sw2 Ethernet1
   no switchport
   ip address 10.0.0.0/31
!
interface Ethernet2
   description sw2 Ethernet2
   no switchport
   ip address 10.0.0.2/31
!
interface Ethernet3
   description host1
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Management0
   ip address 172.20.20.11/24
!
interface Vlan10
   ip address 10.10.10.1/24
!
ip routing
!
ip route 0.0.0.0/0 172.20.20.1
!
router bgp 65001
   router-id 10.255.0.1
   timers bgp 3 9
   maximum-paths 2
   neighbor 10.0.0.1 remote-as 65002
   neighbor 10.0.0.3 remote-as 65002
   network 10.10.10.0/24
   network 10.255.0.1/32
!
end
